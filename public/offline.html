  <head>

    <meta name="theme-color" content="#FFD6E7" />
    <title>UsSpace is offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff8f0; color: #393044; font-family: "Avenir Next", "Segoe UI", sans-serif; }

      h1 { font-family: Georgia, serif; font-weight: 560; font-size: 2.4rem; }
      a { color: #393044; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <p aria-hidden="true" style="font-size:3rem;color:#ff79a8">♡</p>
      <h1>You're offline</h1>
      <p>UsSpace needs a connection to refresh your shared space. Your notes stay private. Open the app again when you are back online.</p>
      <p><a href="./">Try again</a></p>
    </main>
  </body>
